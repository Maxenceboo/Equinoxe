<!-- Email de confirmation d'inscription (Supabase > Authentication > Emails > Confirm signup).
     Sujet : Confirme ton adresse pour Équinoxe -->
<div style="background:#000000;padding:40px 24px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#ffffff">
  <div style="max-width:420px;margin:0 auto">
    <p style="font-size:28px;font-weight:800;letter-spacing:-0.5px;margin:0 0 16px">Équinoxe</p>
    <p style="font-size:16px;line-height:1.5;color:#8a8a8a;margin:0 0 28px">
      Bienvenue ! Confirme ton adresse email pour activer ton compte et commencer à tenir tes objectifs.
    </p>
    <a href="{{ .ConfirmationURL }}"
       style="display:block;text-align:center;background:#ffffff;color:#000000;text-decoration:none;font-weight:600;padding:14px;border-radius:6px">
      Confirmer mon adresse
    </a>
    <p style="font-size:13px;line-height:1.5;color:#8a8a8a;margin:28px 0 0">
      Tu n'as pas créé de compte Équinoxe ? Ignore simplement cet email.
    </p>
  </div>
</div>
