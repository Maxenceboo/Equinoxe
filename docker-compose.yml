# Base PostgreSQL pour lancer le back avec le profil « postgres » (facultatif en local).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: objectifs
      POSTGRES_USER: objectifs
      POSTGRES_PASSWORD: objectifs
    ports:
      - "5432:5432"
    volumes:
      - objectifs-data:/var/lib/postgresql/data
volumes:
  objectifs-data:
