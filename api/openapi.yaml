openapi: 3.0.3
info:
  title: Objectifs perso API
  version: 1.0.0
  description: |
    Contrat de l'API de l'app d'objectifs perso. Ce fichier est la seule source de vérité :
    les VO du back (Spring) et du front (Angular) sont générés à partir de lui, et les
    formulaires du front sont construits à partir des schémas ci-dessous.
servers:
  - url: http://localhost:8080/api
tags:
  - name: Auth
  - name: Objectifs
  - name: Rappels
  - name: Bilan
  - name: Binomes
security:
  - bearerAuth: []

paths:
  /auth/inscription:
    post:
      tags: [Auth]
      operationId: inscription
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Identifiants' }
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erreur' }

  /auth/connexion:
    post:
      tags: [Auth]
      operationId: connexion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Identifiants' }
      responses:
        '200':
          description: Connecté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erreur' }

  /objectifs:
    get:
      tags: [Objectifs]
      operationId: listerObjectifs
      parameters:
        - name: archives
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Objectifs avec la progression de la semaine en cours
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Objectif' }
    post:
      tags: [Objectifs]
      operationId: creerObjectif
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectifSaisie' }
      responses:
        '201':
          description: Objectif créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objectif' }
        '400':
          description: Saisie invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erreur' }

  /objectifs/{id}:
    parameters:
      - $ref: '#/components/parameters/ObjectifId'
    get:
      tags: [Objectifs]
      operationId: lireObjectif
      responses:
        '200':
          description: L'objectif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objectif' }
        '404':
          $ref: '#/components/responses/Introuvable'
    put:
      tags: [Objectifs]
      operationId: modifierObjectif
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectifSaisie' }
      responses:
        '200':
          description: Objectif modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objectif' }
        '404':
          $ref: '#/components/responses/Introuvable'

  /objectifs/{id}/archiver:
    parameters:
      - $ref: '#/components/parameters/ObjectifId'
    post:
      tags: [Objectifs]
      operationId: archiverObjectif
      responses:
        '200':
          description: Objectif archivé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objectif' }
        '404':
          $ref: '#/components/responses/Introuvable'

  /objectifs/{id}/restaurer:
    parameters:
      - $ref: '#/components/parameters/ObjectifId'
    post:
      tags: [Objectifs]
      operationId: restaurerObjectif
      responses:
        '200':
          description: Objectif restauré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objectif' }
        '404':
          $ref: '#/components/responses/Introuvable'

  /objectifs/{id}/validations:
    parameters:
      - $ref: '#/components/parameters/ObjectifId'
    post:
      tags: [Objectifs]
      operationId: validerObjectif
      description: Coche l'objectif pour une date (aujourd'hui par défaut), avec des détails facultatifs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidationSaisie' }
      responses:
        '200':
          description: Objectif mis à jour avec sa nouvelle progression
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objectif' }
        '404':
          $ref: '#/components/responses/Introuvable'

  /objectifs/{id}/validations/{date}:
    parameters:
      - $ref: '#/components/parameters/ObjectifId'
      - name: date
        in: path
        required: true
        schema: { type: string, format: date }
    delete:
      tags: [Objectifs]
      operationId: annulerValidation
      responses:
        '200':
          description: Objectif mis à jour avec sa nouvelle progression
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objectif' }
        '404':
          $ref: '#/components/responses/Introuvable'

  /objectifs/{id}/historique:
    parameters:
      - $ref: '#/components/parameters/ObjectifId'
    get:
      tags: [Objectifs]
      operationId: historiqueObjectif
      parameters:
        - name: mois
          in: query
          required: false
          description: Mois au format AAAA-MM (mois en cours par défaut)
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Historique du mois et statistiques
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Historique' }
        '404':
          $ref: '#/components/responses/Introuvable'

  /objectifs/{id}/statistiques:
    parameters:
      - $ref: '#/components/parameters/ObjectifId'
    get:
      tags: [Objectifs]
      operationId: statistiquesObjectif
      responses:
        '200':
          description: "Totaux, évolution sur 6 mois et types de séance les plus fréquents"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statistiques' }
        '404':
          $ref: '#/components/responses/Introuvable'

  /objectifs/{id}/partage:
    parameters:
      - $ref: '#/components/parameters/ObjectifId'
    post:
      tags: [Binomes]
      operationId: partagerObjectif
      description: Donne le code à transmettre à un ami (créé au premier appel).
      responses:
        '200':
          description: Code de partage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partage' }
        '404':
          $ref: '#/components/responses/Introuvable'

  /binomes:
    get:
      tags: [Binomes]
      operationId: listerBinomes
      responses:
        '200':
          description: Objectifs d'amis suivis
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ObjectifSuivi' }
    post:
      tags: [Binomes]
      operationId: rejoindreBinome
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeBinome' }
      responses:
        '200':
          description: Objectif de l'ami désormais suivi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectifSuivi' }
        '404':
          description: Code inconnu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erreur' }

  /binomes/{objectifId}:
    delete:
      tags: [Binomes]
      operationId: quitterBinome
      parameters:
        - name: objectifId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Ne suit plus cet objectif

  /bilan:
    get:
      tags: [Bilan]
      operationId: bilanSemaine
      parameters:
        - name: jour
          in: query
          required: false
          description: "Un jour de la semaine voulue. Par défaut : la semaine en cours le dimanche, la semaine dernière sinon."
          schema: { type: string, format: date }
      responses:
        '200':
          description: Bilan de la semaine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bilan' }

  /rappels:
    get:
      tags: [Rappels]
      operationId: prochainsRappels
      description: Rappels calculés pour les prochains jours, que l'app programme en notifications locales.
      parameters:
        - name: jours
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 14, default: 7 }
      responses:
        '200':
          description: Rappels à programmer, triés par date
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rappel' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ObjectifId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Introuvable:
      description: Objectif introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }

  schemas:
    Identifiants:
      type: object
      required: [email, motDePasse]
      properties:
        email:
          type: string
          format: email
          title: Email
          maxLength: 120
        motDePasse:
          type: string
          title: Mot de passe
          minLength: 8
          maxLength: 100
          format: password

    Session:
      type: object
      required: [token, email]
      properties:
        token: { type: string }
        email: { type: string }

    Erreur:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    Categorie:
      type: string
      title: Catégorie
      enum: [SPORT, SOMMEIL, AUTRE]
      x-enum-descriptions: [Sport, Sommeil, Autre]

    TypeFrequence:
      type: string
      title: Fréquence
      enum: [PAR_SEMAINE, QUOTIDIEN]
      x-enum-descriptions: [X fois par semaine, Tous les jours]

    ObjectifSaisie:
      type: object
      required: [nom, categorie, typeFrequence, cible, heure]
      properties:
        nom:
          type: string
          title: Nom
          minLength: 1
          maxLength: 50
        categorie:
          $ref: '#/components/schemas/Categorie'
        typeFrequence:
          $ref: '#/components/schemas/TypeFrequence'
        cible:
          type: integer
          title: Nombre de fois par semaine
          minimum: 1
          maximum: 7
          default: 3
        heure:
          type: string
          title: Heure du rappel (ou heure de coucher visée pour le sommeil)
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          default: '18:00'
        couleur:
          type: string
          title: Couleur
          pattern: '^#[0-9a-fA-F]{6}$'
          default: '#ffffff'
        mesure:
          $ref: '#/components/schemas/Mesure'
        objectifQuantite:
          type: number
          format: double
          title: Total visé par semaine (facultatif)
          minimum: 0
          maximum: 100000
        rappelAuto:
          type: boolean
          title: Me rappeler à l'heure où je le fais d'habitude
          description: "L'app apprend l'heure de tes coches (5 coches suffisent) et te rappelle 30 min avant."
          default: false

    Mesure:
      type: string
      title: Objectif chiffré
      enum: [AUCUNE, KM, PAGES, MINUTES]
      x-enum-descriptions: [Non, Kilomètres, Pages, Minutes]
      default: AUCUNE

    Suggestion:
      type: object
      required: [nouvelleCible, raison]
      properties:
        nouvelleCible: { type: integer }
        raison: { type: string }

    Objectif:
      type: object
      required: [id, nom, categorie, typeFrequence, cible, heure, couleur, archive, dateCreation, progression, mesure, rappelAuto, heureRappel]
      properties:
        id: { type: integer, format: int64 }
        nom: { type: string }
        categorie: { $ref: '#/components/schemas/Categorie' }
        typeFrequence: { $ref: '#/components/schemas/TypeFrequence' }
        cible: { type: integer }
        heure: { type: string }
        couleur: { type: string }
        archive: { type: boolean }
        dateCreation: { type: string, format: date }
        progression: { $ref: '#/components/schemas/ProgressionSemaine' }
        mesure: { $ref: '#/components/schemas/Mesure' }
        objectifQuantite: { type: number, format: double }
        rappelAuto: { type: boolean }
        heureHabituelle: { type: string, description: "Heure habituelle de coche (HH:mm), une fois apprise" }
        heureRappel: { type: string, description: Heure effective des rappels (HH:mm) }
        partage: { type: boolean, description: Un code de partage existe }
        suggestion: { $ref: '#/components/schemas/Suggestion' }

    ProgressionSemaine:
      type: object
      required: [debutSemaine, realisees, cible, atteint, joursRestants, faitAujourdhui, serie, meilleureSerie, uniteSerie, jokersRestants]
      properties:
        debutSemaine: { type: string, format: date, description: Lundi de la semaine en cours }
        realisees: { type: integer }
        cible: { type: integer }
        atteint: { type: boolean }
        joursRestants: { type: integer, description: "Jours restants dans la semaine, aujourd'hui compris" }
        faitAujourdhui: { type: boolean }
        message: { type: string, description: Message d'encouragement neutre }
        serie: { type: integer, description: "Série en cours (flamme) : jours d'affilée pour un objectif quotidien, semaines réussies d'affilée sinon" }
        meilleureSerie: { type: integer, description: Record de série dans la même unité }
        uniteSerie: { $ref: '#/components/schemas/UniteSerie' }
        jokersRestants: { type: integer, description: "Jokers encore disponibles ce mois-ci : un jour ou une semaine raté qui ne casse pas la série" }
        quantiteSemaine: { type: number, format: double, description: Total de la semaine pour un objectif chiffré }

    UniteSerie:
      type: string
      enum: [JOURS, SEMAINES]

    TypeSeance:
      type: string
      title: Type
      enum: [COURSE, MUSCU, VELO, NATATION, MARCHE, YOGA, SPORT_COLLECTIF, AUTRE]
      x-enum-descriptions: [Course, Muscu, Vélo, Natation, Marche, Yoga / étirements, Sport collectif, Autre]

    Ressenti:
      type: string
      title: Ressenti
      enum: [FACILE, MOYEN, DUR]
      x-enum-descriptions: [Facile, Moyen, Dur]

    Ponctualite:
      type: string
      title: Coucher
      enum: [A_L_HEURE, RETARD_30_MIN, RETARD_PLUS_1H]
      x-enum-descriptions: [À l'heure, 30 min de retard, Plus d'1 h de retard]

    Reveil:
      type: string
      title: Au réveil
      enum: [REPOSE, MOYEN, FATIGUE]
      x-enum-descriptions: [Reposé, Moyen, Fatigué]

    DetailsSport:
      type: object
      title: Détails de la séance
      properties:
        typeSeance: { $ref: '#/components/schemas/TypeSeance' }
        dureeMinutes:
          type: integer
          title: Durée
          enum: [15, 30, 45, 60, 90]
          x-enum-descriptions: [15 min, 30 min, 45 min, 1 h, 1 h 30 et plus]
        ressenti: { $ref: '#/components/schemas/Ressenti' }

    DetailsSommeil:
      type: object
      title: Détails de la nuit
      properties:
        ponctualite: { $ref: '#/components/schemas/Ponctualite' }
        reveil: { $ref: '#/components/schemas/Reveil' }

    ValidationSaisie:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Date de la validation (aujourd'hui si absente)
        sport: { $ref: '#/components/schemas/DetailsSport' }
        sommeil: { $ref: '#/components/schemas/DetailsSommeil' }
        quantite:
          type: number
          format: double
          title: Combien ?
          minimum: 0
          maximum: 100000

    Validation:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        sport: { $ref: '#/components/schemas/DetailsSport' }
        sommeil: { $ref: '#/components/schemas/DetailsSommeil' }
        quantite: { type: number, format: double }
        heure: { type: string, description: "Heure de la coche (HH:mm), si cochée le jour même" }

    Historique:
      type: object
      required: [mois, validations, serieSemaines, meilleureSerie, semainesReussies, semainesTotales, tauxReussite]
      properties:
        mois: { type: string, description: AAAA-MM }
        validations:
          type: array
          items: { $ref: '#/components/schemas/Validation' }
        serieSemaines: { type: integer, description: Semaines réussies d'affilée jusqu'à maintenant }
        meilleureSerie: { type: integer }
        semainesReussies: { type: integer }
        semainesTotales: { type: integer }
        tauxReussite: { type: number, format: double, description: Entre 0 et 1 }

    Rappel:
      type: object
      required: [objectifId, nomObjectif, dateHeure, message]
      properties:
        objectifId: { type: integer, format: int64 }
        nomObjectif: { type: string }
        dateHeure: { type: string, description: 'Heure locale du téléphone, sans fuseau (AAAA-MM-JJTHH:mm)' }
        message: { type: string }

    Bilan:
      type: object
      required: [debutSemaine, lignes, tenus, total, seances, seancesSemainePrecedente, phrase]
      properties:
        debutSemaine: { type: string, format: date }
        lignes:
          type: array
          items: { $ref: '#/components/schemas/LigneBilan' }
        tenus: { type: integer, description: Objectifs atteints cette semaine }
        total: { type: integer }
        seances: { type: integer, description: "Coches de la semaine, tous objectifs confondus" }
        seancesSemainePrecedente: { type: integer }
        phrase: { type: string }

    LigneBilan:
      type: object
      required: [objectifId, nom, categorie, realisees, cible, atteint, serie, uniteSerie, mesure]
      properties:
        objectifId: { type: integer, format: int64 }
        nom: { type: string }
        categorie: { $ref: '#/components/schemas/Categorie' }
        realisees: { type: integer }
        cible: { type: integer }
        atteint: { type: boolean }
        serie: { type: integer }
        uniteSerie: { $ref: '#/components/schemas/UniteSerie' }
        mesure: { $ref: '#/components/schemas/Mesure' }
        quantite: { type: number, format: double }
        suggestion: { $ref: '#/components/schemas/Suggestion' }

    Statistiques:
      type: object
      required: [totalSeances, totalMinutes, mesure, moyenneParSemaine, mois, types]
      properties:
        totalSeances: { type: integer }
        totalMinutes: { type: integer, description: Somme des durées notées }
        totalQuantite: { type: number, format: double }
        mesure: { $ref: '#/components/schemas/Mesure' }
        moyenneParSemaine: { type: number, format: double }
        mois:
          type: array
          description: "Les 6 derniers mois, du plus ancien au mois en cours"
          items: { $ref: '#/components/schemas/StatMois' }
        types:
          type: array
          description: "Types de séance, du plus fréquent au moins fréquent"
          items: { $ref: '#/components/schemas/RepartitionType' }

    StatMois:
      type: object
      required: [mois, seances, minutes]
      properties:
        mois: { type: string, description: AAAA-MM }
        seances: { type: integer }
        minutes: { type: integer }
        quantite: { type: number, format: double }

    RepartitionType:
      type: object
      required: [type, nombre]
      properties:
        type: { $ref: '#/components/schemas/TypeSeance' }
        nombre: { type: integer }

    Partage:
      type: object
      required: [code, abonnes]
      properties:
        code: { type: string }
        abonnes: { type: integer, description: Amis qui suivent cet objectif }

    CodeBinome:
      type: object
      required: [code]
      properties:
        code:
          type: string
          title: Code de ton binôme
          minLength: 6
          maxLength: 6

    ObjectifSuivi:
      type: object
      required: [objectifId, nom, ami, categorie, progression]
      properties:
        objectifId: { type: integer, format: int64 }
        nom: { type: string }
        ami: { type: string, description: Nom affiché de l'ami (avant l'arobase de son email) }
        categorie: { $ref: '#/components/schemas/Categorie' }
        progression: { $ref: '#/components/schemas/ProgressionSemaine' }
