openapi: 3.0.3
info:
  title: Objectifs perso API
  version: 1.0.0
  description: |
    Contrat des données de l'app d'objectifs perso. Ce fichier est la seule source de vérité
    pour les objets échangés entre les écrans et les cas d'utilisation : les VO TypeScript sont
    générés à partir de lui, et les formulaires sont construits à partir des schémas ci-dessous.
    Les données sont stockées dans Supabase (voir supabase/migrations) ; il n'y a plus de serveur à
    héberger, donc plus de routes HTTP ici.
paths: {}

components:
  schemas:
    Identifiants:
      type: object
      required: [email, motDePasse]
      properties:
        email:
          type: string
          format: email
          title: Email
          maxLength: 120
        motDePasse:
          type: string
          title: Mot de passe
          minLength: 8
          maxLength: 100
          format: password



    Categorie:
      type: string
      title: Catégorie
      enum: [SPORT, SOMMEIL, AUTRE]
      x-enum-descriptions: [Sport, Sommeil, Autre]

    TypeFrequence:
      type: string
      title: Fréquence
      enum: [PAR_SEMAINE, QUOTIDIEN]
      x-enum-descriptions: [X fois par semaine, Tous les jours]

    ObjectifSaisie:
      type: object
      required: [nom, categorie, typeFrequence, cible, heure]
      properties:
        nom:
          type: string
          title: Nom
          minLength: 1
          maxLength: 50
        categorie:
          $ref: '#/components/schemas/Categorie'
        typeFrequence:
          $ref: '#/components/schemas/TypeFrequence'
        cible:
          type: integer
          title: Nombre de fois par semaine
          minimum: 1
          maximum: 7
          default: 3
        heure:
          type: string
          title: Heure du rappel (ou heure de coucher visée pour le sommeil)
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          default: '18:00'
        couleur:
          type: string
          title: Couleur
          pattern: '^#[0-9a-fA-F]{6}$'
          default: '#ffffff'
        mesure:
          $ref: '#/components/schemas/Mesure'
        objectifQuantite:
          type: number
          format: double
          title: Total visé par semaine (facultatif)
          minimum: 0
          maximum: 100000
        rappelAuto:
          type: boolean
          title: Me rappeler à l'heure où je le fais d'habitude
          description: "L'app apprend l'heure de tes coches (5 coches suffisent) et te rappelle 30 min avant."
          default: false
        visibleAmis:
          type: boolean
          title: Visible par mes amis
          description: "Tes amis verront sa progression et sa flamme, jamais tes détails."
          default: false

    Mesure:
      type: string
      title: Objectif chiffré
      enum: [AUCUNE, KM, PAGES, MINUTES]
      x-enum-descriptions: [Non, Kilomètres, Pages, Minutes]
      default: AUCUNE

    Suggestion:
      type: object
      required: [nouvelleCible, raison]
      properties:
        nouvelleCible: { type: integer }
        raison: { type: string }

    Objectif:
      type: object
      required: [id, nom, categorie, typeFrequence, cible, heure, couleur, archive, dateCreation, progression, mesure, rappelAuto, heureRappel]
      properties:
        id: { type: integer, format: int64 }
        nom: { type: string }
        categorie: { $ref: '#/components/schemas/Categorie' }
        typeFrequence: { $ref: '#/components/schemas/TypeFrequence' }
        cible: { type: integer }
        heure: { type: string }
        couleur: { type: string }
        archive: { type: boolean }
        dateCreation: { type: string, format: date }
        progression: { $ref: '#/components/schemas/ProgressionSemaine' }
        mesure: { $ref: '#/components/schemas/Mesure' }
        objectifQuantite: { type: number, format: double }
        rappelAuto: { type: boolean }
        heureHabituelle: { type: string, description: "Heure habituelle de coche (HH:mm), une fois apprise" }
        heureRappel: { type: string, description: Heure effective des rappels (HH:mm) }
        partage: { type: boolean, description: Un code de partage existe }
        visibleAmis: { type: boolean, description: Visible par les amis (sinon privé) }
        suggestion: { $ref: '#/components/schemas/Suggestion' }

    ProgressionSemaine:
      type: object
      required: [debutSemaine, realisees, cible, atteint, joursRestants, faitAujourdhui, serie, meilleureSerie, uniteSerie, jokersRestants]
      properties:
        debutSemaine: { type: string, format: date, description: Lundi de la semaine en cours }
        realisees: { type: integer }
        cible: { type: integer }
        atteint: { type: boolean }
        joursRestants: { type: integer, description: "Jours restants dans la semaine, aujourd'hui compris" }
        faitAujourdhui: { type: boolean }
        message: { type: string, description: Message d'encouragement neutre }
        serie: { type: integer, description: "Série en cours (flamme) : jours d'affilée pour un objectif quotidien, semaines réussies d'affilée sinon" }
        meilleureSerie: { type: integer, description: Record de série dans la même unité }
        uniteSerie: { $ref: '#/components/schemas/UniteSerie' }
        jokersRestants: { type: integer, description: "Jokers encore disponibles ce mois-ci : un jour ou une semaine raté qui ne casse pas la série (+1 après une longue série)" }
        jokerUtilise: { type: string, format: date, description: "Jour (ou lundi) sauvé par un joker ces 14 derniers jours, s'il y en a un" }
        quantiteSemaine: { type: number, format: double, description: Total de la semaine pour un objectif chiffré }

    UniteSerie:
      type: string
      enum: [JOURS, SEMAINES]

    TypeSeance:
      type: string
      title: Type
      enum: [COURSE, MUSCU, VELO, NATATION, MARCHE, YOGA, SPORT_COLLECTIF, AUTRE]
      x-enum-descriptions: [Course, Muscu, Vélo, Natation, Marche, Yoga / étirements, Sport collectif, Autre]

    Ressenti:
      type: string
      title: Ressenti
      enum: [FACILE, MOYEN, DUR]
      x-enum-descriptions: [Facile, Moyen, Dur]

    Ponctualite:
      type: string
      title: Coucher
      enum: [A_L_HEURE, RETARD_30_MIN, RETARD_PLUS_1H]
      x-enum-descriptions: [À l'heure, 30 min de retard, Plus d'1 h de retard]

    Reveil:
      type: string
      title: Au réveil
      enum: [REPOSE, MOYEN, FATIGUE]
      x-enum-descriptions: [Reposé, Moyen, Fatigué]

    DetailsSport:
      type: object
      title: Détails de la séance
      properties:
        typeSeance: { $ref: '#/components/schemas/TypeSeance' }
        dureeMinutes:
          type: integer
          title: Durée
          enum: [15, 30, 45, 60, 90]
          x-enum-descriptions: [15 min, 30 min, 45 min, 1 h, 1 h 30 et plus]
        ressenti: { $ref: '#/components/schemas/Ressenti' }

    DetailsSommeil:
      type: object
      title: Détails de la nuit
      properties:
        ponctualite: { $ref: '#/components/schemas/Ponctualite' }
        reveil: { $ref: '#/components/schemas/Reveil' }

    ValidationSaisie:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Date de la validation (aujourd'hui si absente)
        sport: { $ref: '#/components/schemas/DetailsSport' }
        sommeil: { $ref: '#/components/schemas/DetailsSommeil' }
        quantite:
          type: number
          format: double
          title: Combien ?
          minimum: 0
          maximum: 100000

    Validation:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        sport: { $ref: '#/components/schemas/DetailsSport' }
        sommeil: { $ref: '#/components/schemas/DetailsSommeil' }
        quantite: { type: number, format: double }
        heure: { type: string, description: "Heure de la coche (HH:mm), si cochée le jour même" }

    Historique:
      type: object
      required: [mois, validations, serieSemaines, meilleureSerie, semainesReussies, semainesTotales, tauxReussite]
      properties:
        mois: { type: string, description: AAAA-MM }
        validations:
          type: array
          items: { $ref: '#/components/schemas/Validation' }
        serieSemaines: { type: integer, description: Semaines réussies d'affilée jusqu'à maintenant }
        meilleureSerie: { type: integer }
        semainesReussies: { type: integer }
        semainesTotales: { type: integer }
        tauxReussite: { type: number, format: double, description: Entre 0 et 1 }

    Rappel:
      type: object
      required: [objectifId, nomObjectif, dateHeure, message]
      properties:
        objectifId: { type: integer, format: int64 }
        nomObjectif: { type: string }
        dateHeure: { type: string, description: 'Heure locale du téléphone, sans fuseau (AAAA-MM-JJTHH:mm)' }
        message: { type: string }

    Bilan:
      type: object
      required: [debutSemaine, lignes, tenus, total, seances, seancesSemainePrecedente, phrase]
      properties:
        debutSemaine: { type: string, format: date }
        lignes:
          type: array
          items: { $ref: '#/components/schemas/LigneBilan' }
        tenus: { type: integer, description: Objectifs atteints cette semaine }
        total: { type: integer }
        seances: { type: integer, description: "Coches de la semaine, tous objectifs confondus" }
        seancesSemainePrecedente: { type: integer }
        phrase: { type: string }

    LigneBilan:
      type: object
      required: [objectifId, nom, categorie, realisees, cible, atteint, serie, uniteSerie, mesure]
      properties:
        objectifId: { type: integer, format: int64 }
        nom: { type: string }
        categorie: { $ref: '#/components/schemas/Categorie' }
        realisees: { type: integer }
        cible: { type: integer }
        atteint: { type: boolean }
        serie: { type: integer }
        uniteSerie: { $ref: '#/components/schemas/UniteSerie' }
        mesure: { $ref: '#/components/schemas/Mesure' }
        quantite: { type: number, format: double }
        suggestion: { $ref: '#/components/schemas/Suggestion' }

    Statistiques:
      type: object
      required: [totalSeances, totalMinutes, mesure, moyenneParSemaine, mois, types]
      properties:
        totalSeances: { type: integer }
        totalMinutes: { type: integer, description: Somme des durées notées }
        totalQuantite: { type: number, format: double }
        mesure: { $ref: '#/components/schemas/Mesure' }
        moyenneParSemaine: { type: number, format: double }
        mois:
          type: array
          description: "Les 6 derniers mois, du plus ancien au mois en cours"
          items: { $ref: '#/components/schemas/StatMois' }
        types:
          type: array
          description: "Types de séance, du plus fréquent au moins fréquent"
          items: { $ref: '#/components/schemas/RepartitionType' }

    StatMois:
      type: object
      required: [mois, seances, minutes]
      properties:
        mois: { type: string, description: AAAA-MM }
        seances: { type: integer }
        minutes: { type: integer }
        quantite: { type: number, format: double }

    RepartitionType:
      type: object
      required: [type, nombre]
      properties:
        type: { $ref: '#/components/schemas/TypeSeance' }
        nombre: { type: integer }

    Partage:
      type: object
      required: [code, abonnes]
      properties:
        code: { type: string }
        abonnes: { type: integer, description: Amis qui suivent cet objectif }

    CodeBinome:
      type: object
      required: [code]
      properties:
        code:
          type: string
          title: Code de ton binôme
          minLength: 6
          maxLength: 6

    CodeAmi:
      type: object
      required: [code]
      properties:
        code:
          type: string
          title: Code de ton ami
          minLength: 6
          maxLength: 6

    Ami:
      type: object
      required: [id, nom, objectifs]
      properties:
        id: { type: string }
        nom: { type: string, description: Nom affiché (avant l'arobase de son email) }
        objectifs:
          type: array
          description: Ses objectifs visibles par ses amis
          items: { $ref: '#/components/schemas/ObjectifSuivi' }

    StatutCommun:
      type: string
      enum: [ACTIF, ENVOYEE, RECUE]
      description: "ACTIF : on le fait à deux ; ENVOYEE : j'ai invité, en attente ; RECUE : on m'a invité"

    ObjectifCommun:
      type: object
      required: [id, statut, ami, amiId, nom, categorie, typeFrequence, cible, heure]
      properties:
        id: { type: integer, format: int64 }
        statut: { $ref: '#/components/schemas/StatutCommun' }
        demande: { type: boolean, description: "true : l'invité a demandé à rejoindre l'objectif du propriétaire" }
        ami: { type: string }
        amiId: { type: string }
        monObjectif: { type: integer, format: int64, description: "Mon objectif relié (absent pour une invitation reçue)" }
        nom: { type: string }
        categorie: { $ref: '#/components/schemas/Categorie' }
        typeFrequence: { $ref: '#/components/schemas/TypeFrequence' }
        cible: { type: integer }
        heure: { type: string }
        flamme: { type: integer, description: Série réussie à deux d'affilée }
        record: { type: integer }
        uniteSerie: { $ref: '#/components/schemas/UniteSerie' }
        moi: { type: integer, description: "Ce que j'ai fait aujourd'hui (quotidien) ou cette semaine" }
        duAmi: { type: integer, description: "Ce que mon ami a fait aujourd'hui (quotidien) ou cette semaine" }
        objectifPeriode: { type: integer, description: "Ce qu'il faut à chacun sur la période en cours" }

    ObjectifSuivi:
      type: object
      required: [objectifId, nom, ami, categorie, progression]
      properties:
        objectifId: { type: integer, format: int64 }
        nom: { type: string }
        ami: { type: string, description: Nom affiché de l'ami (avant l'arobase de son email) }
        categorie: { $ref: '#/components/schemas/Categorie' }
        progression: { $ref: '#/components/schemas/ProgressionSemaine' }
        enCommun: { type: boolean, description: Déjà fait à deux }

    # ---------- Récompenses ----------
    Profil:
      type: object
      required: [points, niveau, nomNiveau, pointsNiveau, pointsNiveauSuivant, solde, palettes, badges]
      properties:
        prenom: { type: string, description: Prénom dans le foyer }
        points: { type: integer, description: "10 par coche, 50 par semaine tenue" }
        niveau: { type: integer, description: "Numéro du niveau, à partir de 1" }
        nomNiveau: { type: string, description: "Phase de lune : Nouvelle lune, Croissant…" }
        pointsNiveau: { type: integer, description: Points à partir desquels ce niveau est atteint }
        pointsNiveauSuivant: { type: integer, description: Points du niveau suivant }
        solde: { type: integer, description: "Points encore à dépenser (gagnés moins achats)" }
        palettes:
          type: array
          description: Palettes de couleurs possédées (Aurore est offerte)
          items: { type: string }
        badges:
          type: array
          items: { $ref: '#/components/schemas/Badge' }

    Badge:
      type: object
      required: [code, nom, description, recompense, obtenu]
      properties:
        code: { type: string }
        nom: { type: string }
        description: { type: string, description: Comment l'obtenir }
        recompense: { type: string, description: Ce qu'il rapporte }
        obtenu: { type: boolean }
        le: { type: string, format: date, description: Date d'obtention }

    # ---------- Foyer ----------
    Foyer:
      type: object
      description: Un groupe (famille, amis, collègues). On peut être dans plusieurs groupes.
      required: [id, nom, code, objectifSemaine, cochesSemaine, membres, parent]
      properties:
        id: { type: integer, format: int64 }
        nom: { type: string }
        code: { type: string, description: Code à 6 chiffres pour rejoindre le foyer }
        recompense: { type: string, description: Récompense choisie par les parents }
        objectifSemaine: { type: integer, description: Coches à faire ensemble dans la semaine }
        cochesSemaine: { type: integer, description: Coches de toute la famille cette semaine }
        parent: { type: boolean, description: L'utilisateur est parent (peut régler le foyer) }
        membres:
          type: array
          items: { $ref: '#/components/schemas/MembreFoyer' }

    MembreFoyer:
      type: object
      required: [id, prenom, parent, moi, coches, objectifs, tenus]
      properties:
        id: { type: string }
        prenom: { type: string }
        parent: { type: boolean }
        moi: { type: boolean }
        coches: { type: integer }
        objectifs: { type: integer }
        tenus: { type: integer }

    TypeEncouragement:
      type: string
      enum: [BRAVO, COURAGE, FIER, MERCI]
      x-enum-descriptions: [Bravo, Courage, Fier de toi, Merci]

    Encouragement:
      type: object
      required: [id, de, type]
      properties:
        id: { type: integer, format: int64 }
        de: { type: string, description: Prénom de l'expéditeur }
        type: { $ref: '#/components/schemas/TypeEncouragement' }

    CreationFoyer:
      type: object
      required: [nom, prenom]
      properties:
        nom: { type: string, title: Nom du groupe, minLength: 1, maxLength: 40, description: "Par exemple : Les Martin, Les copains du foot" }
        prenom: { type: string, title: Ton prénom, minLength: 1, maxLength: 30 }

    RejoindreFoyer:
      type: object
      required: [code, prenom]
      properties:
        code: { type: string, title: Code du groupe, pattern: '^\s*\d{3}\s?\d{3}\s*$', description: 6 chiffres donnés par un membre du groupe }
        prenom: { type: string, title: Ton prénom, minLength: 1, maxLength: 30 }

    ReglagesFoyer:
      type: object
      required: [objectifSemaine]
      properties:
        recompense: { type: string, title: Récompense de la semaine, maxLength: 80, description: "Par exemple : soirée film" }
        objectifSemaine: { type: integer, title: Coches à faire ensemble, minimum: 1, maximum: 500 }
