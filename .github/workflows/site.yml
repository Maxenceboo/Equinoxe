# Envoie le dossier site/ sur l'hébergement OVH (equinoxe-app.fr) par FTP à chaque modification.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   OVH_FTP_SERVEUR (ex. ftp.cluster0XX.hosting.ovh.net), OVH_FTP_UTILISATEUR, OVH_FTP_MOT_DE_PASSE
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  ovh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVEUR }}
          username: ${{ secrets.OVH_FTP_UTILISATEUR }}
          password: ${{ secrets.OVH_FTP_MOT_DE_PASSE }}
          local-dir: ./site/
          server-dir: ./www/
