<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Équinoxe · Télécharger</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" href="../favicon.png" />
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><mask id="m"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="42" r="27" fill="#000"/></mask><circle cx="50" cy="52" r="32" fill="#fff" mask="url(#m)"/><circle cx="50" cy="58" r="11" fill="#fff"/></svg>
    <h1>Télécharger Équinoxe</h1>
    <p id="infos">Application Android, dernière version stable.</p>
    <a class="bouton" id="lien" href="../apk/equinoxe.apk" download>Télécharger l'APK</a>
    <ol class="etapes">
      <li>Ouvre le fichier téléchargé sur ton téléphone.</li>
      <li>Si Android le demande, autorise l'installation depuis ton navigateur.</li>
      <li>Les versions suivantes s'installent par-dessus, sans perdre ton compte.</li>
    </ol>
  </main>
  <script>
    fetch('../apk/version.json', { cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((v) => {
        const mo = (v.taille / 1048576).toFixed(1).replace('.', ',');
        const date = new Date(v.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('infos').textContent = `Version ${v.version}, du ${date} · ${mo} Mo · Android`;
        document.getElementById('lien').href = `../apk/equinoxe.apk?v=${encodeURIComponent(v.version)}`;
      })
      .catch(() => {});
  </script>
</body>
</html>
