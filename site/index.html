<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Équinoxe · Tes objectifs, une semaine à la fois</title>
  <meta name="description" content="Une petite app pour tenir le sport, le coucher, la lecture, seul ou en famille. Gratuite, sans pub, sur Android et iPhone." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="favicon.png" />
  <style>
    :root { --marge: clamp(24px, 9vw, 150px); --noir: #000; --blanc: #fff; --gris: #8a8a8a; --rayon: 6px;
      --police: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--noir); color: var(--blanc); font-family: var(--police); -webkit-font-smoothing: antialiased;
      transition: background-color .6s ease, color .6s ease; overflow-x: hidden; }
    body.jour { background: var(--blanc); color: var(--noir); }
    a { color: inherit; }
    img { display: block; max-width: 100%; }
    figure { margin: 0; }

    .marque { position: fixed; top: 22px; left: var(--marge); z-index: 10; display: flex; align-items: center; gap: 10px;
      font-weight: 700; text-decoration: none; font-size: 15px; mix-blend-mode: difference; color: #fff; }
    .marque svg { width: 22px; height: 22px; }
    .lune-lecture { position: fixed; top: 20px; right: var(--marge); z-index: 10; width: 26px; height: 26px; mix-blend-mode: difference; }

    /* Téléphone avec une vraie capture */
    .tel { border: 1px solid #333; border-radius: 36px; padding: 10px; background: #0a0a0a; width: 100%; }
    .tel img { border-radius: 27px; width: 100%; height: auto; aspect-ratio: 390 / 844; object-fit: cover; }

    /* Accroche */
    .accroche { min-height: 100svh; padding: 110px var(--marge) 60px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 6vw; align-items: center; }
    .accroche h1 { margin: 0; font-size: clamp(44px, 6.4vw, 108px); line-height: .98; letter-spacing: -.045em; font-weight: 800; }
    .accroche p { margin: 26px 0 38px; color: var(--gris); font-size: clamp(17px, 1.4vw, 21px); line-height: 1.45; max-width: 30ch; }
    .accroche .tel { max-width: 330px; justify-self: end; animation: monte 1s .2s cubic-bezier(.2,.7,.2,1) both; }
    .accroche h1, .accroche p, .accroche .actions { animation: monte .8s cubic-bezier(.2,.7,.2,1) both; }
    .accroche p { animation-delay: .1s } .accroche .actions { animation-delay: .2s }
    @keyframes monte { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

    .bouton { display: inline-block; background: var(--blanc); color: var(--noir); text-decoration: none; font-weight: 700;
      font-size: 17px; padding: 18px 30px; border-radius: var(--rayon); transition: transform .15s ease; }
    .bouton:hover { transform: translateY(-2px); }
    body.jour .bouton { background: var(--noir); color: var(--blanc); }
    .version { display: block; margin-top: 14px; font-size: 13px; color: #777; }

    /* Trois écrans */
    .ecrans { padding: 14vh var(--marge); display: grid; grid-template-columns: repeat(3, 1fr); gap: 4vw; }
    .ecran { opacity: 0; transform: translateY(40px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
    .ecran:nth-child(2) { transition-delay: .12s; margin-top: 8vh; }
    .ecran:nth-child(3) { transition-delay: .24s; margin-top: 16vh; }
    .ecran.vu { opacity: 1; transform: none; }
    .ecran h2 { margin: 26px 0 0; font-size: clamp(20px, 1.8vw, 28px); letter-spacing: -.02em; font-weight: 700; }

    /* En bref */
    .faits { padding: 6vh var(--marge) 16vh; display: flex; flex-wrap: wrap; gap: 14px; }
    .faits span { border: 1px solid #333; border-radius: 999px; padding: 12px 22px; font-size: 15px; color: #ccc; }

    /* Bascule */
    .bascule { min-height: 90svh; display: flex; flex-direction: column; justify-content: center; padding: 0 var(--marge); }
    .bascule h2 { margin: 0 0 40px; font-size: clamp(40px, 6vw, 100px); letter-spacing: -.04em; line-height: 1; font-weight: 800; }
    footer { padding: 28px var(--marge); display: flex; justify-content: space-between; font-size: 13px; color: #777; }
    footer a { text-decoration: none; }

    @media (max-width: 760px) {
      .accroche { grid-template-columns: 1fr; padding-top: 96px; gap: 48px; }
      .accroche .tel { justify-self: start; max-width: 78vw; }
      .ecrans { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; padding-top: 6vh; padding-bottom: 6vh; scrollbar-width: none; }
      .ecrans::-webkit-scrollbar { display: none; }
      .ecran { flex: 0 0 72vw; scroll-snap-align: start; opacity: 1; transform: none; margin-top: 0 !important; }
      .bouton { display: block; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001s !important; animation-delay: 0s !important; transition-duration: .001s !important; }
    }
  </style>
</head>
<body>
  <a class="marque" href="./" aria-label="Équinoxe, accueil">
    <svg viewBox="0 0 100 100" aria-hidden="true"><mask id="m"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="42" r="27" fill="#000"/></mask><circle cx="50" cy="52" r="32" fill="#fff" mask="url(#m)"/><circle cx="50" cy="58" r="11" fill="#fff"/></svg>
    Équinoxe
  </a>
  <svg class="lune-lecture" viewBox="0 0 26 26" aria-hidden="true">
    <defs><mask id="phase"><rect width="26" height="26" fill="#fff"/><circle id="ombre" cx="13" cy="13" r="12" fill="#000"/></mask></defs>
    <circle cx="13" cy="13" r="12" fill="none" stroke="#fff" stroke-width="1"/>
    <circle cx="13" cy="13" r="12" fill="#fff" mask="url(#phase)"/>
  </svg>

  <section class="accroche">
    <div>
      <h1>Tes objectifs, une semaine à la fois.</h1>
      <p>Sport, sommeil, lecture. Tu coches quand c'est fait, seul ou en famille.</p>
      <div class="actions">
        <a class="bouton" href="telecharger/">Télécharger l'app</a>
        <span class="version" data-version></span>
      </div>
    </div>
    <div class="tel"><img src="images/semaine.webp" alt="L'écran Semaine de l'app" width="390" height="844" /></div>
  </section>

  <section class="ecrans" aria-label="L'app en images">
    <figure class="ecran"><div class="tel"><img src="images/assistant.webp" alt="Créer un objectif en trois questions" loading="lazy" width="390" height="844" /></div><h2>Trois questions pour commencer</h2></figure>
    <figure class="ecran"><div class="tel"><img src="images/groupe.webp" alt="Un groupe familial et sa jauge commune" loading="lazy" width="390" height="844" /></div><h2>Une jauge pour la famille</h2></figure>
    <figure class="ecran"><div class="tel"><img src="images/badges.webp" alt="Le profil avec le niveau et les badges" loading="lazy" width="390" height="844" /></div><h2>Des badges à gagner</h2></figure>
  </section>

  <section class="faits" aria-label="En bref">
    <span>Gratuit</span><span>Sans pub</span><span>Un rappel par jour</span><span>Un joker par mois</span><span>Android et iPhone</span>
  </section>

  <section class="bascule" id="bascule">
    <h2>Ça prend une minute.</h2>
    <div>
      <a class="bouton" href="telecharger/">Télécharger l'app</a>
      <span class="version" data-version></span>
    </div>
  </section>

  <footer><span>© 2026 Équinoxe</span><a href="telecharger/">Télécharger</a></footer>

  <script>
    const ombre = document.getElementById('ombre');
    const majLune = () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      ombre.setAttribute('cx', String(13 - (max > 0 ? Math.min(1, scrollY / max) : 0) * 26));
    };
    addEventListener('scroll', majLune, { passive: true }); majLune();

    const vu = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && e.target.classList.add('vu')), { threshold: .2 });
    document.querySelectorAll('.ecran').forEach((el) => vu.observe(el));

    new IntersectionObserver(([e]) => document.body.classList.toggle('jour', e.isIntersecting), { threshold: .4 }).observe(document.getElementById('bascule'));

    fetch('apk/version.json', { cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((v) => document.querySelectorAll('[data-version]').forEach((el) => { el.textContent = 'Version ' + v.version + ' · gratuite'; }))
      .catch(() => {});
  </script>
</body>
</html>
